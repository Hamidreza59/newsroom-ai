name: studio

on:
  push:
    paths:
      - "services/studio/**"
      - "packages/contracts/**"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "services/studio/**"
      - "packages/contracts/**"
      - ".github/workflows/studio.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
