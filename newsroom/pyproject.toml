[project]
name = "newsroom"
version = "0.1.0"
description = "Multi-agent AI newsroom: market data + AI/tech news -> daily animated video script and narration"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.20",
    "httpx>=0.28",
    "truststore>=0.10",
    "pydantic>=2.10",
    "feedparser>=6.0",
    "numpy>=2.0",
    "soundfile>=0.13",
    "kokoro-onnx>=0.5",
    "langgraph>=1.2.20",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
]

[project.scripts]
newsroom = "newsroom.cli:main"
newsroom-mcp = "newsroom.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom"]

[tool.uv]
exclude-newer = "2026-11-08T00:00:00Z"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
