[project]
name = "newsroom-core"
version = "0.2.0"
description = "Shared contracts, settings and HTTP helpers"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10", "httpx>=0.28", "truststore>=0.10"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_core"]
