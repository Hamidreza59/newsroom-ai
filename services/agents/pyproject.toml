[project]
name = "newsroom-agents"
version = "0.2.0"
description = "LangGraph agents that write and fact-check the show"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["newsroom-core", "mcp>=1.20", "langgraph>=1.0", "langchain-core>=1.0", "langchain-ollama>=1.0", "langchain-openai>=1.0"]

[project.scripts]
newsroom-agents = "newsroom_agents.cli:main"

[tool.uv.sources]
newsroom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_agents"]
