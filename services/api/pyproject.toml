[project]
name = "newsroom-api"
version = "0.2.0"
description = "Website API: markets, tagged news, episodes and weekly features"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["newsroom-core", "mcp>=1.20", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
newsroom-api = "newsroom_api.app:main"

[tool.uv.sources]
newsroom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_api"]
