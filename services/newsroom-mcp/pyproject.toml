[project]
name = "newsroom-mcp"
version = "0.2.0"
description = "MCP server: market data, news wire and RAG memory"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["newsroom-core", "mcp>=1.20", "feedparser>=6.0", "numpy>=2.0", "uvicorn>=0.30"]

[project.scripts]
newsroom-mcp = "newsroom_mcp.server:main"

[tool.uv.sources]
newsroom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_mcp"]
