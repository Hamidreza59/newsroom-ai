[project]
name = "newsroom-publisher"
version = "0.2.0"
description = "Publisher: website posts and upload packages for each episode"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["newsroom-core"]

[project.scripts]
newsroom-publisher = "newsroom_publisher.cli:main"

[tool.uv.sources]
newsroom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_publisher"]
