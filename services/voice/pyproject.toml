[project]
name = "newsroom-voice"
version = "0.2.0"
description = "Voice service: narration, timing, captions, lip-sync and episode contract"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["newsroom-core", "numpy>=2.0", "soundfile>=0.13", "kokoro-onnx>=0.5"]

[project.scripts]
newsroom-voice = "newsroom_voice.cli:main"

[tool.uv.sources]
newsroom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_voice"]
